<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="card shadow w-50 mx-auto">
        <div class="card-header bg-info text-white text-center">
            <h3>Hồ sơ Sinh viên</h3>
        </div>
        <div class="card-body" th:if="${student != null}">
            <p><strong>Mã SV:</strong> <span th:text="${student.id}"></span></p>
            <p><strong>Họ tên:</strong> <span th:text="${student.name}"></span></p>
            <p><strong>Giới tính:</strong> <span th:text="${student.gender}"></span></p>
            <p><strong>Tuổi:</strong> <span th:text="${student.age}"></span></p>
            <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
        </div>
        <div class="card-body text-danger text-center" th:if="${student == null}">
            <p>Không tìm thấy sinh viên này!</p>
        </div>
        <div class="card-footer text-center">
            <a th:href="@{/students}" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </div>

</body>
</html>
