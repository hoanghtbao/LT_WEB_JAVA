<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 10px; }
        .form-group { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Quản lý danh sách sinh viên</h1>

    <!-- Form nhập liệu -->
    <div id="form-container">
        <h3>Thêm / Cập nhật sinh viên</h3>
        <input type="hidden" id="studentId">
        <div class="form-group"><input type="text" id="code" placeholder="Mã SV"></div>
        <div class="form-group"><input type="text" id="name" placeholder="Họ tên"></div>
        <div class="form-group"><input type="text" id="email" placeholder="Email"></div>
        <div class="form-group"><input type="text" id="phone" placeholder="Số điện thoại"></div>
        <div class="form-group"><input type="text" id="className" placeholder="Lớp"></div>
        <button onclick="saveStudent()">Lưu thông tin</button>
    </div>

    <hr>

    <!-- Bảng danh sách -->
    <h3>Danh sách sinh viên</h3>
    <table>
        <thead>
            <tr>
                <th>Mã SV</th><th>Họ tên</th><th>Email</th><th>SĐT</th><th>Lớp</th><th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Dữ liệu sẽ được load vào đây -->
        </tbody>
    </table>

    <script>
    const API_URL = '/api/students';

    // 1. Lấy danh sách
    function loadStudents() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                let html = '';
                data.forEach(s => {
                    html += `<tr>
                        <td>${s.studentCode}</td>
                        <td>${s.fullName}</td>
                        <td>${s.email}</td>
                        <td>${s.phone || ''}</td>
                        <td>${s.className || ''}</td>
                        <td>
                            <button onclick="editStudent('${s.id}', '${s.studentCode}', '${s.fullName}', '${s.email}', '${s.phone}', '${s.className}')">Sửa</button>
                            <button onclick="deleteStudent('${s.id}')">Xóa</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('studentTableBody').innerHTML = html;
            });
    }

    // 2. Thêm mới HOẶC Cập nhật
    function saveStudent() {
        const id = document.getElementById('studentId').value;
        const student = {
            studentCode: document.getElementById('code').value,
            fullName: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            className: document.getElementById('className').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        }).then(() => {
            resetForm();
            loadStudents();
            alert(id ? 'Đã cập nhật thành công!' : 'Đã thêm thành công!');
        });
    }

    // 3. Đưa dữ liệu lên form để Sửa
    function editStudent(id, code, name, email, phone, className) {
        document.getElementById('studentId').value = id;
        document.getElementById('code').value = code;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('phone').value = phone;
        document.getElementById('className').value = className;
    }

    // 4. Xóa
    function deleteStudent(id) {
        if (confirm('Bạn có chắc muốn xóa?')) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' })
                .then(() => loadStudents());
        }
    }

    // Reset form
    function resetForm() {
        document.getElementById('studentId').value = '';
        document.getElementById('code').value = '';
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('className').value = '';
    }

    loadStudents();
    </script>
</body>
</html>
