<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sinh viên</title>
    <!-- Nhúng thư viện Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="text-center text-primary mb-4">DANH SÁCH SINH VIÊN</h2>

    <!-- Form Tìm kiếm -->
    <form th:action="@{/students}" method="get" class="d-flex mb-3 w-50">
        <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Nhập tên cần tìm...">
        <button type="submit" class="btn btn-outline-primary">Tìm</button>
        <a th:href="@{/students}" class="btn btn-outline-secondary ms-2">Reset</a>
    </form>

    <!-- Bảng dữ liệu Bootstrap -->
    <table class="table table-bordered table-striped table-hover shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Họ tên</th>
                <th>Giới tính</th>
                <th>Tuổi</th>
                <th>Email</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="sv : ${students}">
                <td th:text="${sv.id}"></td>
                <td th:text="${sv.name}"></td>
                <td th:text="${sv.gender}"></td>
                <td th:text="${sv.age}"></td>
                <td th:text="${sv.email}"></td>
                <td>
                    <!-- Nút dẫn sang trang chi tiết -->
                    <a th:href="@{/students/{id}(id=${sv.id})}" class="btn btn-info btn-sm text-white">Xem chi tiết</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
